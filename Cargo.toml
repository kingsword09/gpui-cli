[package]
name = "gpui-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Kingsword <kingsword09@gmail.com>"]
description = "CLI tool to initialize and develop multi-platform GPUI desktop and mobile applications"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["gpui", "gui", "cli", "mobile", "desktop"]
categories = ["command-line-utilities", "gui"]
include = ["/src/**", "/tests/**", "/templates/**", "/assets/**", "/scripts/**", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CONTRIBUTING.md", "/LICENSE-*", "/THIRD_PARTY_NOTICES.md"]

[[bin]]
name = "gpui"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
inquire = "0.9"
colored = "3.1"
anyhow = "1.0"
include_dir = "0.7"
which = "8.0"
tempfile = "3.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "8.0"
notify-debouncer-full = "0.6"
getrandom = "0.4"
sha2 = "0.10"
ctrlc = { version = "3.5", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
