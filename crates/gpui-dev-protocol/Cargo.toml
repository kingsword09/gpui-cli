[package]
name = "gpui-dev-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Versioned wire protocol for GPUI development tooling"
readme = "README.md"
repository = "https://github.com/kingsword09/gpui-cli"
keywords = ["gpui", "protocol", "development-tools"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
