name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo x check-design-docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build CLI for host doctor evidence
        run: cargo build --locked --bin gpui
      - name: Run host doctor evidence
        run: python scripts/doctor-host-evidence.py --gpui target/debug/gpui --output doctor-host-evidence
      - name: Upload host doctor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-host-${{ matrix.os }}
          path: doctor-host-evidence/
          if-no-files-found: warn

  baseline-driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live-baseline.py --self-test

  mobile-evidence-driver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts/tests -v

  desktop-template:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Generate an app with a title requiring escaping
        run: >-
          target/debug/gpui init template-probe
          --path "$RUNNER_TEMP/gpui-template"
          --targets macos --bundle-id com.example.templateprobe
          --title 'R&D "Desk" <工具> \path {{APP_CRATE}}'
      - name: Check generated debug and release code
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/template-check
        run: |
          cargo check --manifest-path "$RUNNER_TEMP/gpui-template/Cargo.toml" --workspace
          cargo check --manifest-path "$RUNNER_TEMP/gpui-template/Cargo.toml" --workspace --features gpui-dev --locked
          cargo check --manifest-path "$RUNNER_TEMP/gpui-template/Cargo.toml" --workspace --release --locked
          target/debug/gpui init ios-template-probe \
            --path "$RUNNER_TEMP/gpui-ios-template" --targets ios --bundle-id com.example.iostemplateprobe
          cargo check --manifest-path "$RUNNER_TEMP/gpui-ios-template/Cargo.toml" --workspace --target aarch64-apple-ios-sim
          if cargo check --manifest-path "$RUNNER_TEMP/gpui-template/Cargo.toml" --workspace --release --features gpui-dev --locked; then
            echo 'release + gpui-dev unexpectedly compiled'
            exit 1
          fi
          if cargo check --manifest-path "$RUNNER_TEMP/gpui-template/Cargo.toml" --workspace --features gpui-dev,gpui-profile --locked; then
            echo 'gpui-dev + gpui-profile unexpectedly compiled'
            exit 1
          fi
      - name: Package and check from a clean directory
        run: |
          export CARGO_TARGET_DIR="$RUNNER_TEMP/gpui-package-target"
          clean_root="$RUNNER_TEMP/gpui-package-clean"
          mkdir -p "$clean_root"
          cargo package --manifest-path "$RUNNER_TEMP/gpui-template/Cargo.toml" --workspace --allow-dirty --no-verify
          cargo package --manifest-path "$RUNNER_TEMP/gpui-template/Cargo.toml" --workspace --allow-dirty --no-verify --list > "$RUNNER_TEMP/package-list.txt"
          for archive in "$CARGO_TARGET_DIR/package"/*.crate; do
            name="$(basename "$archive" .crate)"
            mkdir "$clean_root/$name"
            tar -xzf "$archive" -C "$clean_root/$name"
          done
          app_dir="$clean_root/template-probe-app-0.1.0/template-probe-app-0.1.0"
          cat > "$clean_root/Cargo.toml" <<EOF
          [workspace]
          members = [
            "template-probe-app-0.1.0/template-probe-app-0.1.0",
            "template-probe-desktop-0.1.0/template-probe-desktop-0.1.0",
          ]
          resolver = "2"

          [patch.crates-io]
          template-probe-app = { path = "$app_dir" }
          EOF
          cargo check --manifest-path "$clean_root/Cargo.toml"

  android-template:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired SDK package named "tools".
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
      - run: cargo build --locked
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Install the pinned Gradle wrapper distribution
        run: bash templates/android/gradle/gradlew --version
      - name: Probe the active Android BuildKey toolchain identity
        env:
          GPUI_REQUIRE_ANDROID_TOOLCHAIN_FINGERPRINT: '1'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cargo test --locked android_toolchain_fingerprint_reads_a_complete_active_environment
      - name: Verify generated resources, release output and packaged ABIs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          python3 scripts/check-android-template.py --gpui target/debug/gpui

  android-native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare complete GPUI APK build
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          bash templates/android/gradle/gradlew --version
          cargo build --locked --bin gpui
          cargo install cargo-ndk --locked --version 4.1.2
      - name: Build real GPUI APK without emulator
        run: python3 scripts/check-android-runtime.py --gpui target/debug/gpui --build-only --abi x86_64 --output android-build-evidence
      - name: Upload complete native build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-build
          path: android-build-evidence/
          if-no-files-found: warn

  doctor-android-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare pinned tools and cold AVD
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/gpui-cold-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME" mobile-preflight
          exec > >(tee mobile-preflight/cold-avd-setup.log) 2>&1
          sdkmanager "emulator" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "system-images;android-35;google_apis;x86_64"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          bash templates/android/gradle/gradlew --version
          printf 'no\n' | avdmanager create avd --name gpui-ci-x86 --path "$ANDROID_AVD_HOME/gpui-ci-x86.avd" --package "system-images;android-35;google_apis;x86_64"
          test -s "$ANDROID_AVD_HOME/gpui-ci-x86.avd/config.ini"
          cp "$ANDROID_AVD_HOME/gpui-ci-x86.avd/config.ini" mobile-preflight/avd-config.ini
          avdmanager list avd > mobile-preflight/avdmanager-list.txt
      - run: cargo build --locked --bin gpui
      - name: Verify cold inventory and ABI mismatch without boot
        run: |
          cargo install cargo-ndk --locked --version 4.1.2
          python3 scripts/doctor-mobile-evidence.py --gpui target/debug/gpui --platform android --phase cold --device gpui-ci-x86 --output doctor-android-cold-evidence
      - name: Upload cold doctor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-android-cold
          path: |
            doctor-android-cold-evidence/
            mobile-preflight/
          if-no-files-found: warn

  android-emulator:
    strategy:
      fail-fast: false
      matrix:
        mode: [doctor, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare pinned mobile toolchain
        run: |
          sdkmanager "emulator" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          bash templates/android/gradle/gradlew --version
          cargo build --locked --bin gpui
      - name: Install required cargo-ndk for doctor and native builds
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Install emulator host libraries before acceleration preflight
        run: |
          set -euo pipefail
          mkdir -p mobile-preflight
          exec > >(tee mobile-preflight/emulator-libraries.log) 2>&1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpulse0
          ldd "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64" | tee mobile-preflight/shared-libraries.txt
      - name: Enable and verify KVM acceleration
        run: |
          set -euo pipefail
          mkdir -p mobile-preflight
          exec > >(tee mobile-preflight/kvm-preflight.log) 2>&1
          ls -l /dev/kvm
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee mobile-preflight/acceleration.log
          "$ANDROID_HOME/emulator/emulator" -version 2>&1 | tee mobile-preflight/emulator-version.log
      - name: Boot accelerated x86_64 emulator and run selected evidence layer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader
          script: python3 scripts/${{ matrix.mode == 'doctor' && 'doctor-mobile-evidence.py --platform android --phase live' || 'check-android-runtime.py' }} --gpui target/debug/gpui --device emulator-5554 --output android-${{ matrix.mode }}-evidence
      - name: Preserve boot failure diagnostics
        if: always()
        run: |
          mkdir -p mobile-preflight
          timeout 20s adb devices -l > mobile-preflight/adb-devices.txt 2>&1 || true
          timeout 20s adb -s emulator-5554 shell getprop > mobile-preflight/guest-properties.txt 2>&1 || true
          timeout 20s adb -s emulator-5554 logcat -d -b all > mobile-preflight/boot-logcat.txt 2>&1 || true
      - name: Upload live evidence and preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-${{ matrix.mode }}
          path: |
            mobile-preflight/
            android-${{ matrix.mode }}-evidence/
          if-no-files-found: warn

  ios-simulator:
    strategy:
      fail-fast: false
      matrix:
        mode: [doctor, build, smoke]
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Prepare required iOS doctor and build tools
        run: |
          set -euo pipefail
          mkdir -p mobile-preflight
          exec > >(tee mobile-preflight/ios-toolchain.log) 2>&1
          brew install xcodegen
          xcodegen --version
          rustup target list --installed
          xcodebuild -version
      - run: cargo build --locked --bin gpui
      - name: Record cold doctor or full-app simulator smoke
        run: |
          extra_args=()
          if [[ "${{ matrix.mode }}" == "smoke" ]]; then
            extra_args+=(--disable-push-service)
          fi
          python3 scripts/check-ios-simulator.py --gpui target/debug/gpui --mode "${{ matrix.mode }}" --runtime 26.2 --output "ios-${{ matrix.mode }}-evidence" "${extra_args[@]}"
      - name: Upload isolated simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-${{ matrix.mode }}
          path: |
            ios-${{ matrix.mode }}-evidence/
            mobile-preflight/
          if-no-files-found: warn
