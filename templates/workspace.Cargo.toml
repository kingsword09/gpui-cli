[workspace]
resolver = "2"
members = [
    "crates/app",
{{DESKTOP_MEMBER}}]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "MIT OR Apache-2.0"

# Debug builds must stay unwindable: the live-mode panic hook reports panics
# but does not (and cannot) keep the process alive; `gpui run --live` restarts.
[profile.dev]
panic = "unwind"

# GPUI is published as a family of `gpui-pre-*` crates that must all share one
# version. `gpui-kit` is pulled from git rather than crates.io because its
# iOS/Android builds deliberately avoid the desktop-only platform crate.
[workspace.dependencies]
gpui = { package = "gpui-pre", version = "={{GPUI_PRE_VERSION}}" }
gpui-kit = { version = "={{GPUI_KIT_VERSION}}", git = "{{GPUI_KIT_GIT}}", rev = "{{GPUI_KIT_REV}}", default-features = false, features = ["component"] }
serde_json = "1.0"
# Root crate of the gpui-mobile repository; the `package` key is required
# because the repository is named differently from the crate inside it.
gpui-mobile = { package = "{{GPUI_MOBILE_PKG}}", version = "={{GPUI_MOBILE_VERSION}}", git = "{{GPUI_MOBILE_GIT}}", rev = "{{GPUI_MOBILE_REV}}" }
log = "0.4"
{{ANDROID_PATCH}}
