name: {{XCODE_TARGET}}
options:
  bundleIdPrefix: {{BUNDLE_PREFIX}}
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

targets:
  {{XCODE_TARGET}}:
    type: application
    platform: iOS
    sources:
      - path: App.swift
        type: file
        buildPhase: sources
      - path: gpui_ios.h
        type: file
        buildPhase: headers
      - path: LaunchScreen.storyboard
        type: file
        buildPhase: resources
      - path: Assets.xcassets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: {{BUNDLE_ID}}
        PRODUCT_NAME: {{XCODE_TARGET}}
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: "Embedding.h"
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_BITCODE: NO
        # Disable the Xcode 16 debug dylib executor - the Rust library is
        # statically linked, so the dynamic-loader approach fails on device.
        ENABLE_DEBUG_DYLIB: NO
        OTHER_LINK_BINARY_WITH_LIBRARIES_SECTION_TYPE: static
        DEAD_CODE_STRIPPING: NO
        # Force-load the Rust static library so `gpui_ios_register_app`
        # (defined by the app crate) is not stripped by the linker.
        OTHER_LDFLAGS:
          - "-force_load"
          - "$(GPUI_STATIC_LIB)"
          - "-lc++"
          - "-framework UIKit"
          - "-framework Metal"
          - "-framework MetalKit"
          - "-framework QuartzCore"
          - "-framework CoreGraphics"
          - "-framework CoreText"
          - "-framework CoreFoundation"
          - "-framework Foundation"
          - "-framework Security"
          - "-framework SystemConfiguration"
          - "-framework AudioToolbox"
          - "-framework WebKit"
          - "-framework CoreMedia"
          - "-framework AVFoundation"
          - "-framework LocalAuthentication"
          - "-framework Contacts"
          - "-framework EventKit"
          - "-framework StoreKit"
          - "-framework CoreMotion"
          - "-ObjC"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "USE_GPUI_RUST=1"
          - "$(inherited)"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)"
        VALID_ARCHS: "arm64"
        ARCHS: "arm64"
        ONLY_ACTIVE_ARCH: YES
        # The Cargo workspace root sits two levels above mobile/ios.
        "GPUI_STATIC_LIB[sdk=iphonesimulator*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios-sim/$(GPUI_PROFILE_DIR)/lib{{APP_LIB_NAME}}.a"
        "GPUI_STATIC_LIB[sdk=iphoneos*]": "$(PROJECT_DIR)/../../target/aarch64-apple-ios/$(GPUI_PROFILE_DIR)/lib{{APP_LIB_NAME}}.a"
      configs:
        Debug:
          GCC_OPTIMIZATION_LEVEL: "0"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          GPUI_PROFILE_DIR: debug
        Release:
          GCC_OPTIMIZATION_LEVEL: "s"
          DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          GPUI_PROFILE_DIR: release
    preBuildScripts:
      - name: "Build Rust Static Library"
        script: |
          set -euo pipefail

          # mobile/ios -> Cargo workspace root
          WORKSPACE_ROOT="${PROJECT_DIR}/../.."
          cd "${WORKSPACE_ROOT}"

          if [ "${PLATFORM_NAME}" = "iphonesimulator" ]; then
            RUST_TARGET="aarch64-apple-ios-sim"
          else
            RUST_TARGET="aarch64-apple-ios"
          fi

          if [ "${CONFIGURATION}" = "Release" ]; then
            CARGO_FLAGS="--release"
          else
            CARGO_FLAGS=""
          fi

          echo "Building {{APP_CRATE}} for ${RUST_TARGET} (${CONFIGURATION})..."
          rustup target add "${RUST_TARGET}" 2>/dev/null || true
          cargo build --lib -p {{APP_CRATE}} --target "${RUST_TARGET}" ${CARGO_FLAGS}
          echo "Rust build complete for ${RUST_TARGET}"
        shell: /bin/bash
        basedOnDependencyAnalysis: false
